<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ОБОИ С 3D ERROR ИЗ SOURCE ENGINE</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        body {
            background: #0a0a0f;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0a0a0f;
            z-index: 100;
            transition: opacity 0.8s;
        }

        .loader-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid #6c5ce7;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>

    <div id="loader">
        <div class="loader-spinner"></div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
        import { MTLLoader } from 'three/addons/loaders/MTLLoader.js';

        // —— СЦЕНА ——
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a0f);

        // —— КАМЕРА (ОТДАЛИЛ) ——
        const camera = new THREE.PerspectiveCamera(30, window.innerWidth / window.innerHeight, 0.001, 100);
        camera.position.set(0, 0.5, 3.5); // было 0.8 → стало 3.5

        // —— РЕНДЕР ——
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        document.body.prepend(renderer.domElement);

        // —— КОНТРОЛ ——
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.08;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 2.5; // чуть медленнее, чтобы видно было
        controls.enableZoom = true;
        controls.zoomSpeed = 0.5;
        controls.enablePan = false;
        controls.maxPolarAngle = Math.PI / 1.8;
        controls.minPolarAngle = Math.PI / 12;
        controls.target.set(0, 0.3, 0); // цель чуть выше
        controls.minDistance = 0.5;
        controls.maxDistance = 10;

        // —— СВЕТ ——
        const mainLight = new THREE.DirectionalLight(0xffffff, 2.5);
        mainLight.position.set(2, 3, 4);
        mainLight.castShadow = true;
        scene.add(mainLight);

        const backLight = new THREE.DirectionalLight(0x4dc9ff, 1.0);
        backLight.position.set(-3, 1, -4);
        scene.add(backLight);

        const bottomLight = new THREE.DirectionalLight(0xff4d7a, 0.8);
        bottomLight.position.set(1, -4, 2);
        scene.add(bottomLight);

        const ambientLight = new THREE.AmbientLight(0x222244, 0.7);
        scene.add(ambientLight);

        // —— ДЕКОРАТИВНЫЕ ОГНИ ——
        const pointLight1 = new THREE.PointLight(0x6c5ce7, 1.0, 3);
        pointLight1.position.set(2, 0.5, 2);
        scene.add(pointLight1);

        const pointLight2 = new THREE.PointLight(0x00d2ff, 0.7, 3);
        pointLight2.position.set(-2, 0.4, 2);
        scene.add(pointLight2);

        // —— ПОЛ (для теней) ——
        const ground = new THREE.Mesh(
            new THREE.PlaneGeometry(6, 6),
            new THREE.ShadowMaterial({ opacity: 0.15, color: 0x000000 })
        );
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -0.02;
        ground.receiveShadow = true;
        scene.add(ground);

        // —— ЗВЁЗДЫ ——
        const starsGeometry = new THREE.BufferGeometry();
        const starCount = 3000;
        const positions = new Float32Array(starCount * 3);
        for (let i = 0; i < starCount * 3; i += 3) {
            const radius = 8 + Math.random() * 25;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos((Math.random() * 2) - 1);
            positions[i] = radius * Math.sin(phi) * Math.cos(theta);
            positions[i + 1] = radius * Math.sin(phi) * Math.sin(theta);
            positions[i + 2] = radius * Math.cos(phi);
        }
        starsGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        const stars = new THREE.Points(
            starsGeometry,
            new THREE.PointsMaterial({
                color: 0xffffff,
                size: 0.04,
                transparent: true,
                opacity: 0.4,
                blending: THREE.AdditiveBlending,
                sizeAttenuation: true
            })
        );
        scene.add(stars);

        // —— ЗАГРУЗКА МОДЕЛИ ——
        const loader = document.getElementById('loader');

        function onModelLoaded(object) {
            // МАСШТАБ 0.01
            object.scale.set(0.01, 0.01, 0.01);

            // Ставим вертикально
            object.rotation.x = -Math.PI / 2;

            // Поднимаем над полом
            const box = new THREE.Box3().setFromObject(object);
            const center = box.getCenter(new THREE.Vector3());
            const minY = box.min.y;
            object.position.y = -minY + 0.015;
            object.position.x = -center.x;
            object.position.z = -center.z;

            // Настройка материалов
            object.traverse((child) => {
                if (child.isMesh) {
                    child.castShadow = true;
                    child.receiveShadow = true;
                    if (child.material) {
                        const mats = Array.isArray(child.material) ? child.material : [child.material];
                        mats.forEach(mat => {
                            mat.roughness = 0.2;
                            mat.metalness = 0.9;
                            mat.envMapIntensity = 1.5;
                        });
                    }
                }
            });

            scene.add(object);
            loader.style.opacity = '0';
            setTimeout(() => loader.style.display = 'none', 800);

            // Клик = стоп авто-вращения
            renderer.domElement.addEventListener('click', () => {
                controls.autoRotate = false;
            });
            renderer.domElement.addEventListener('dblclick', () => {
                controls.autoRotate = !controls.autoRotate;
            });

            console.log('✅ Микро-модель 0.01 загружена! Камера отдалена.');
        }

        function createTestModel() {
            const geometry = new THREE.TorusKnotGeometry(0.3, 0.08, 80, 12);
            const material = new THREE.MeshPhysicalMaterial({
                color: 0x6c5ce7,
                metalness: 0.95,
                roughness: 0.08,
                emissive: 0x2d1b69,
                emissiveIntensity: 0.5,
                clearcoat: 0.6,
            });
            const model = new THREE.Mesh(geometry, material);
            model.scale.set(0.01, 0.01, 0.01);
            model.position.y = 0.15;
            model.castShadow = true;
            model.receiveShadow = true;
            scene.add(model);
            loader.style.opacity = '0';
            setTimeout(() => loader.style.display = 'none', 800);
            console.log('🔮 Тестовая микро-модель 0.01');
        }

        // —— АВТО-ЗАГРУЗКА ——
        fetch('model.obj')
            .then(response => {
                if (response.ok) {
                    fetch('model.mtl')
                        .then(mtlRes => {
                            if (mtlRes.ok) {
                                const mtlLoader = new MTLLoader();
                                mtlLoader.load('model.mtl', (materials) => {
                                    materials.preload();
                                    new OBJLoader().setMaterials(materials).load('model.obj', onModelLoaded);
                                });
                            } else {
                                new OBJLoader().load('model.obj', onModelLoaded);
                            }
                        })
                        .catch(() => new OBJLoader().load('model.obj', onModelLoaded));
                } else {
                    createTestModel();
                }
            })
            .catch(() => createTestModel());

        // —— АНИМАЦИЯ ——
        function animate() {
            requestAnimationFrame(animate);
            stars.rotation.y += 0.0002;

            const time = Date.now() * 0.0003;
            pointLight1.position.x = Math.sin(time) * 2.5;
            pointLight1.position.z = Math.cos(time) * 2.5;
            pointLight2.position.x = Math.sin(time + 2) * 2;
            pointLight2.position.z = Math.cos(time + 2) * 2;

            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // —— РЕСАЙЗ ——
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
