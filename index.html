<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Объект · Маленькая модель</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        body {
            background: #0a0a0f;
            font-family: 'Segoe UI', sans-serif;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        .hint {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.25);
            font-size: 13px;
            letter-spacing: 2px;
            user-select: none;
            pointer-events: none;
            background: rgba(0, 0, 0, 0.4);
            padding: 8px 20px;
            border-radius: 30px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: opacity 1s;
        }

        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0a0a0f;
            color: white;
            font-size: 16px;
            z-index: 100;
            transition: opacity 0.8s;
            flex-direction: column;
            gap: 20px;
        }

        .loader-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid #6c5ce7;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div id="loader">
        <div class="loader-spinner"></div>
        <span>Загрузка 3D модели...</span>
    </div>

    <div class="hint">🖱 Тяни · Крути · Приближай</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
        import { MTLLoader } from 'three/addons/loaders/MTLLoader.js';

        // —— Сцена ——
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a0f);

        // —— Камера ——
        const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0.5, 2.5);

        // —— Рендер ——
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        document.body.prepend(renderer.domElement);

        // —— Орбит контрол ——
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.08;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 2.0;
        controls.enableZoom = true;
        controls.zoomSpeed = 0.8;
        controls.enablePan = false;
        controls.maxPolarAngle = Math.PI / 1.6;
        controls.minPolarAngle = Math.PI / 8;
        controls.target.set(0, 0.5, 0);

        // —— Свет ——
        const mainLight = new THREE.DirectionalLight(0xffffff, 1.8);
        mainLight.position.set(3, 4, 5);
        mainLight.castShadow = true;
        scene.add(mainLight);

        const backLight = new THREE.DirectionalLight(0x4dc9ff, 0.8);
        backLight.position.set(-2, 1, -4);
        scene.add(backLight);

        const bottomLight = new THREE.DirectionalLight(0xff4d7a, 0.5);
        bottomLight.position.set(1, -4, 2);
        scene.add(bottomLight);

        const ambientLight = new THREE.AmbientLight(0x222244, 0.5);
        scene.add(ambientLight);

        // —— Декоративные огни ——
        const pointLight1 = new THREE.PointLight(0x6c5ce7, 0.6, 5);
        pointLight1.position.set(2, 1, 2);
        scene.add(pointLight1);

        const pointLight2 = new THREE.PointLight(0x00d2ff, 0.4, 5);
        pointLight2.position.set(-2, 0.5, 2);
        scene.add(pointLight2);

        // —— Пол (прозрачная плоскость для теней) ——
        const groundGeometry = new THREE.PlaneGeometry(6, 6);
        const groundMaterial = new THREE.ShadowMaterial({
            opacity: 0.3,
            color: 0x000000
        });
        const ground = new THREE.Mesh(groundGeometry, groundMaterial);
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -0.1;
        ground.receiveShadow = true;
        scene.add(ground);

        // —— Звёзды ——
        const starsGeometry = new THREE.BufferGeometry();
        const starCount = 1500;
        const positions = new Float32Array(starCount * 3);
        for (let i = 0; i < starCount * 3; i += 3) {
            const radius = 15 + Math.random() * 25;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos((Math.random() * 2) - 1);
            positions[i] = radius * Math.sin(phi) * Math.cos(theta);
            positions[i + 1] = radius * Math.sin(phi) * Math.sin(theta);
            positions[i + 2] = radius * Math.cos(phi);
        }
        starsGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        const starsMaterial = new THREE.PointsMaterial({
            color: 0xffffff,
            size: 0.06,
            transparent: true,
            opacity: 0.5,
            blending: THREE.AdditiveBlending,
            sizeAttenuation: true
        });
        const stars = new THREE.Points(starsGeometry, starsMaterial);
        scene.add(stars);

        // —— Загрузка модели ——
        const loader = document.getElementById('loader');

        function onModelLoaded(object) {
            // МАСШТАБ: уменьшаем (0.3 = 30% от оригинала)
            object.scale.set(0.3, 0.3, 0.3);
            
            // ПОВОРОТ: ставим вертикально
            // Если модель лежит на боку - пробуй разные комбинации:
            object.rotation.x = -Math.PI / 2;  // Ставим на ноги
            // object.rotation.z = Math.PI / 2; // Альтернативный вариант
            
            // ПОЗИЦИЯ: поднимаем выше пола
            const box = new THREE.Box3().setFromObject(object);
            const size = box.getSize(new THREE.Vector3());
            const center = box.getCenter(new THREE.Vector3());
            
            // Смещаем так, чтобы модель стояла на "полу" (y=0)
            const minY = box.min.y;
            object.position.y = -minY + 0.1; // чуть выше пола
            
            // Центрируем по горизонтали
            object.position.x = -center.x;
            object.position.z = -center.z;
            
            // Настройка материалов
            object.traverse((child) => {
                if (child.isMesh) {
                    child.castShadow = true;
                    child.receiveShadow = true;
                    if (child.material) {
                        const mats = Array.isArray(child.material) ? child.material : [child.material];
                        mats.forEach(mat => {
                            mat.roughness = 0.3;
                            mat.metalness = 0.7;
                            mat.envMapIntensity = 1.0;
                        });
                    }
                }
            });

            scene.add(object);
            loader.style.opacity = '0';
            setTimeout(() => loader.style.display = 'none', 800);
            
            // Клик = стоп авто-вращения
            renderer.domElement.addEventListener('click', () => {
                controls.autoRotate = false;
            });
            renderer.domElement.addEventListener('dblclick', () => {
                controls.autoRotate = !controls.autoRotate;
            });

            console.log('✅ Модель загружена! Размер: 0.3');
            console.log(`📐 Габариты: ${size.x.toFixed(2)} × ${size.y.toFixed(2)} × ${size.z.toFixed(2)}`);
        }

        function createTestModel() {
            const geometry = new THREE.TorusKnotGeometry(0.5, 0.15, 80, 12);
            const material = new THREE.MeshPhysicalMaterial({
                color: 0x6c5ce7,
                metalness: 0.9,
                roughness: 0.15,
                emissive: 0x2d1b69,
                emissiveIntensity: 0.3,
                clearcoat: 0.4,
            });
            const model = new THREE.Mesh(geometry, material);
            model.scale.set(0.3, 0.3, 0.3);
            model.position.y = 0.4;
            model.castShadow = true;
            model.receiveShadow = true;
            scene.add(model);
            loader.style.opacity = '0';
            setTimeout(() => loader.style.display = 'none', 800);
            console.log('🔮 Тестовая модель (узел)');
        }

        // —— Авто-загрузка ——
        fetch('model.obj')
            .then(response => {
                if (response.ok) {
                    fetch('model.mtl')
                        .then(mtlRes => {
                            if (mtlRes.ok) {
                                const mtlLoader = new MTLLoader();
                                mtlLoader.load('model.mtl', (materials) => {
                                    materials.preload();
                                    const objLoader = new OBJLoader();
                                    objLoader.setMaterials(materials);
                                    objLoader.load('model.obj', onModelLoaded);
                                });
                            } else {
                                const objLoader = new OBJLoader();
                                objLoader.load('model.obj', onModelLoaded);
                            }
                        })
                        .catch(() => {
                            const objLoader = new OBJLoader();
                            objLoader.load('model.obj', onModelLoaded);
                        });
                } else {
                    createTestModel();
                }
            })
            .catch(() => createTestModel());

        // —— Анимация ——
        function animate() {
            requestAnimationFrame(animate);
            stars.rotation.y += 0.0002;
            
            const time = Date.now() * 0.0003;
            pointLight1.position.x = Math.sin(time) * 2.5;
            pointLight1.position.z = Math.cos(time) * 2.5;
            pointLight2.position.x = Math.sin(time + 2) * 2;
            pointLight2.position.z = Math.cos(time + 2) * 2;

            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // —— Ресайз ——
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Скрываем подсказку
        setTimeout(() => {
            document.querySelector('.hint').style.opacity = '0';
        }, 8000);
    </script>
</body>
</html>
