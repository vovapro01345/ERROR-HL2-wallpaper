<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Объект · Живые обои</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        body {
            background: #0a0a0f;
            font-family: 'Segoe UI', sans-serif;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        /* —— Подсказка для управления —— */
        .hint {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.2);
            font-size: 14px;
            letter-spacing: 2px;
            user-select: none;
            pointer-events: none;
            background: rgba(0, 0, 0, 0.3);
            padding: 10px 24px;
            border-radius: 30px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: opacity 0.8s;
        }

        .hint:hover {
            opacity: 0;
        }

        /* —— Лоадер (пока модель грузится) —— */
        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0a0a0f;
            color: white;
            font-size: 18px;
            z-index: 100;
            transition: opacity 0.8s;
        }

        .loader-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid #6c5ce7;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <!-- Лоадер -->
    <div id="loader">
        <div class="loader-spinner"></div>
        <span>Загрузка 3D модели...</span>
    </div>

    <!-- Подсказка -->
    <div class="hint">🖱 Тяни мышкой · Крути модель</div>

    <!-- Подключаем Three.js и его расширения -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        // —— Импорты ——
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
        import { MTLLoader } from 'three/addons/loaders/MTLLoader.js';

        // —— Сцена ——
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a0f);

        // —— Камера ——
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 5);
        camera.lookAt(0, 0, 0);

        // —— Рендер ——
        const renderer = new THREE.WebGLRenderer({ 
            antialias: true,
            alpha: false
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        document.body.prepend(renderer.domElement);

        // —— Орбит контрол (вращение мышкой) ——
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 1.5;
        controls.enableZoom = true;
        controls.zoomSpeed = 0.5;
        controls.enablePan = false;
        controls.maxPolarAngle = Math.PI / 1.8;
        controls.minPolarAngle = Math.PI / 6;
        controls.target.set(0, 0, 0);

        // —— Свет ——
        // Основной свет (спереди)
        const mainLight = new THREE.DirectionalLight(0xffffff, 1.5);
        mainLight.position.set(2, 3, 4);
        mainLight.castShadow = true;
        scene.add(mainLight);

        // Заполняющий свет (сзади)
        const backLight = new THREE.DirectionalLight(0x4dc9ff, 0.6);
        backLight.position.set(-2, -1, -3);
        scene.add(backLight);

        // Подсветка снизу
        const bottomLight = new THREE.DirectionalLight(0xff4d7a, 0.4);
        bottomLight.position.set(0, -3, 1);
        scene.add(bottomLight);

        // Ambient (общий фон)
        const ambientLight = new THREE.AmbientLight(0x222244, 0.5);
        scene.add(ambientLight);

        // —— Светящиеся точки (декоративные) ——
        const pointLight1 = new THREE.PointLight(0x6c5ce7, 0.8, 10);
        pointLight1.position.set(2, 1, 2);
        scene.add(pointLight1);

        const pointLight2 = new THREE.PointLight(0x00d2ff, 0.6, 10);
        pointLight2.position.set(-2, -1, 2);
        scene.add(pointLight2);

        // —— Фон: частицы (звёзды) ——
        const starsGeometry = new THREE.BufferGeometry();
        const starCount = 2000;
        const positions = new Float32Array(starCount * 3);
        for (let i = 0; i < starCount * 3; i += 3) {
            const radius = 20 + Math.random() * 30;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos((Math.random() * 2) - 1);
            positions[i] = radius * Math.sin(phi) * Math.cos(theta);
            positions[i + 1] = radius * Math.sin(phi) * Math.sin(theta);
            positions[i + 2] = radius * Math.cos(phi);
        }
        starsGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        const starsMaterial = new THREE.PointsMaterial({
            color: 0xffffff,
            size: 0.08,
            transparent: true,
            opacity: 0.6,
            blending: THREE.AdditiveBlending,
            sizeAttenuation: true
        });
        const stars = new THREE.Points(starsGeometry, starsMaterial);
        scene.add(stars);

        // —— Загрузка модели ——
        const loader = document.getElementById('loader');
        let modelLoaded = false;

        // Функция загрузки с MTL (если есть)
        function loadModelWithMTL(objPath, mtlPath) {
            const mtlLoader = new MTLLoader();
            mtlLoader.load(mtlPath, (materials) => {
                materials.preload();
                const objLoader = new OBJLoader();
                objLoader.setMaterials(materials);
                objLoader.load(objPath, (object) => {
                    onModelLoaded(object);
                }, undefined, onError);
            }, undefined, onError);
        }

        // Функция загрузки только OBJ (без материалов)
        function loadModelOnlyOBJ(path) {
            const objLoader = new OBJLoader();
            objLoader.load(path, (object) => {
                onModelLoaded(object);
            }, undefined, onError);
        }

        function onModelLoaded(object) {
            // —— Настраиваем модель ——
            object.scale.set(0.8, 0.8, 0.8);
            
            // Центрируем модель
            const box = new THREE.Box3().setFromObject(object);
            const center = box.getCenter(new THREE.Vector3());
            object.position.sub(center);
            
            // Добавляем тени
            object.traverse((child) => {
                if (child.isMesh) {
                    child.castShadow = true;
                    child.receiveShadow = true;
                    // Добавляем блеск материалам
                    if (child.material) {
                        if (Array.isArray(child.material)) {
                            child.material.forEach(mat => {
                                mat.roughness = 0.3;
                                mat.metalness = 0.7;
                                mat.envMapIntensity = 1.0;
                            });
                        } else {
                            child.material.roughness = 0.3;
                            child.material.metalness = 0.7;
                            child.material.envMapIntensity = 1.0;
                        }
                    }
                }
            });

            scene.add(object);
            modelLoaded = true;
            loader.style.opacity = '0';
            setTimeout(() => loader.style.display = 'none', 800);

            // Отключаем авто-вращение после первого клика
            renderer.domElement.addEventListener('click', () => {
                controls.autoRotate = false;
            });
            renderer.domElement.addEventListener('dblclick', () => {
                controls.autoRotate = !controls.autoRotate;
            });

            console.log('✅ 3D модель успешно загружена!');
        }

        function onError(error) {
            console.error('❌ Ошибка загрузки модели:', error);
            loader.innerHTML = `
                <div style="color: #ff6b6b; text-align: center;">
                    <div style="font-size: 40px; margin-bottom: 10px;">⚠️</div>
                    <div>Не удалось загрузить модель</div>
                    <div style="font-size: 13px; opacity: 0.6; margin-top: 10px;">
                        Поместите <b>model.obj</b> и <b>model.mtl</b> в папку с этим файлом
                    </div>
                    <div style="font-size: 13px; opacity: 0.4; margin-top: 5px;">
                        Или используйте встроенную тестовую модель
                    </div>
                </div>
            `;
            // Создаём тестовую модель (тор)
            createTestModel();
        }

        // —— Тестовая модель (если нет OBJ) ——
        function createTestModel() {
            const geometry = new THREE.TorusKnotGeometry(1, 0.3, 100, 16);
            const material = new THREE.MeshPhysicalMaterial({
                color: 0x6c5ce7,
                metalness: 0.8,
                roughness: 0.2,
                emissive: 0x2d1b69,
                emissiveIntensity: 0.2,
                clearcoat: 0.3,
            });
            const model = new THREE.Mesh(geometry, material);
            model.scale.set(0.8, 0.8, 0.8);
            model.castShadow = true;
            model.receiveShadow = true;
            scene.add(model);
            modelLoaded = true;
            loader.style.opacity = '0';
            setTimeout(() => loader.style.display = 'none', 800);
            console.log('🔮 Используется тестовая модель (Torus Knot)');
        }

        // —— Пытаемся загрузить модель ——
        // Вариант 1: Если есть MTL
        // loadModelWithMTL('model.obj', 'model.mtl');

        // Вариант 2: Только OBJ (без материалов)
        // loadModelOnlyOBJ('model.obj');

        // Вариант 3: Авто-определение
        fetch('model.obj')
            .then(response => {
                if (response.ok) {
                    // Проверяем, есть ли MTL
                    fetch('model.mtl')
                        .then(mtlRes => {
                            if (mtlRes.ok) {
                                loadModelWithMTL('model.obj', 'model.mtl');
                            } else {
                                loadModelOnlyOBJ('model.obj');
                            }
                        })
                        .catch(() => loadModelOnlyOBJ('model.obj'));
                } else {
                    createTestModel();
                }
            })
            .catch(() => createTestModel());

        // —— Анимация ——
        function animate() {
            requestAnimationFrame(animate);

            // Вращаем звёзды
            stars.rotation.y += 0.0002;
            stars.rotation.x += 0.0001;

            // Двигаем источники света по кругу
            const time = Date.now() * 0.0003;
            pointLight1.position.x = Math.sin(time) * 3;
            pointLight1.position.z = Math.cos(time) * 3;
            pointLight2.position.x = Math.sin(time + 2) * 2.5;
            pointLight2.position.z = Math.cos(time + 2) * 2.5;

            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        // —— Ресайз ——
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // —— Дополнительно: скрываем подсказку через 10 секунд ——
        setTimeout(() => {
            const hint = document.querySelector('.hint');
            if (hint) hint.style.opacity = '0';
        }, 10000);

        console.log('🚀 3D обои запущены!');
    </script>
</body>
</html>
